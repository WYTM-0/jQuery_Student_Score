  <body>
    <div>
      <table>
        <thead>
          <tr>
            <th style="width: 5%">ID</th>
            <th style="width: 30%">Name</th>
            <th>Midterm</th>
            <th>Final</th>
            <th>Total</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <script>
        $(document).ready(function () {
            function displayStudents() {

          $("#table-body").empty();

          $.each(students, function (index, student) {

              let row = `
                  <tr data-index="${index}">
                      <td>${student.id}</td>
                      <td>${student.name}</td>
                      <td class="editable" data-field="midterm">${student.midterm}</td>
                      <td class="editable" data-field="final">${student.final}</td>
                      <td class="total"></td>
                      <td class="grade"></td>
                  </tr>
              `;

              $("#table-body").append(row);

          });

      }


      function calculateTotal(student) {
          return student.midterm + student.final;
      }


      function calculateGrade(total) {

          if (total >= 80) {
              return "A";
          } else if (total >= 70) {
              return "B";
          } else if (total >= 60) {
              return "C";
          } else if (total >= 50) {
              return "D";
          } else {
              return "F";
          }

      }


      displayStudents();


      $("#table-body").on("click", ".editable", function () {

          let cell = $(this);

          if (cell.find("input").length > 0) {
              return;
          }

          let oldScore = cell.text().trim();

          let input = $("<input>");

          input.attr("type", "number");
          input.attr("min", 0);
          input.attr("max", 50);
          input.val(oldScore);

          // Keep input inside the same table cell
          input.css({
              width: "90%",
              boxSizing: "border-box"
          });


          cell.empty();
          cell.append(input);

          input.focus();
          input.select();


          input.on("keydown", function (event) {

              if (event.key === "Enter") {

                  let newScore = parseInt(input.val());

                  if (isNaN(newScore) || newScore < 0 || newScore > 50) {

                      alert("Score must be between 0 and 50");

                      cell.text(oldScore);

                      return;
                  }


                  let row = cell.closest("tr");
                  let index = row.data("index");
                  let field = cell.data("field");


                  students[index][field] = newScore;

                  cell.text(newScore);


                  let total = calculateTotal(students[index]);
                  let grade = calculateGrade(total);

                  row.find(".total").text(total);
                  row.find(".grade").text(grade);


              } else if (event.key === "Escape") {

                  cell.text(oldScore);

              }

          });

      });

  });
    </script>
